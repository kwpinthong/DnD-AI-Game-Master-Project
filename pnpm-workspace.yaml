packages:
  - apps/*
  - packages/*

# better-sqlite3 ships N-API prebuilds (win32-x64, linux-x64, ...) inside the npm package.
# pnpm only sees binding.gyp and would run node-gyp; skip it so install needs no build tools.
allowBuilds:
  esbuild: true
  better-sqlite3: false

# ws 8.23.0 (pulled in by @fastify/websocket) was only 10 days old at GEN-056; pinned to the
# previous patch line until it has aged (Q-107).
overrides:
  ws: 8.22.2
