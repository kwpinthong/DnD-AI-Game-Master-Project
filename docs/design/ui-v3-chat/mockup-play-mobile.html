<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>B+C · มือถือ</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Trirong:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1422}
.ic{display:inline-block;width:24px;height:24px;flex:none;background:url(mockup-icon-sheet.jpg) no-repeat;background-size:400% 300%;border-radius:6px}
.hp{background-position:0% 0%}.st{background-position:33.33% 0%}.coin{background-position:66.66% 0%}
.obs{background-position:100% 50%}.per{background-position:66.66% 100%}.rest{background-position:100% 100%}.sth{background-position:33.33% 100%}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: Anuphan, sans-serif; color: #E8EEF5; background: #0B1422; display: flex; flex-direction: column; overflow: hidden">
<header style="background: #0F1A2B; border-bottom: 1px solid #2B3F5A; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: Trirong, serif; font-size: 15px">น้ำพุกลางเมือง</span>
<span style="font-size: 12px; color: #F0B44C">วัน 2 · บ่าย · ฝน</span>
</div>
<div style="display: flex; gap: 14px; align-items: center; font-size: 13px">
<span style="display: flex; gap: 4px; align-items: center"><span class="ic hp" aria-hidden="true"></span>22/30</span>
<span style="display: flex; gap: 4px; align-items: center"><span class="ic st" aria-hidden="true"></span>ปกติ</span>
<span style="display: flex; gap: 4px; align-items: center"><span class="ic coin" aria-hidden="true"></span>15</span>
<span style="margin-left: auto; font-size: 11px; color: #9FB0C3">ส่งแล้ว 2/4</span>
</div>
</header>
<main aria-label="บทสนทนาในฉาก" style="flex: 1; overflow: hidden; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: flex-end"><div style="max-width: 78%; background: #3A2E14; border: 1px solid #F0B44C; border-radius: 14px 14px 4px 14px; padding: 8px 12px; font-size: 15px; line-height: 1.5">เล่นพิณเพลงพื้นบ้านใต้ซุ้มประตู</div></div>
<div style="padding-left: 38px; font-size: 14px; line-height: 1.7; color: #C8D4E1; font-style: italic">ฝนโปรยลงบนจัตุรัสจนผิวน้ำพุแตกเป็นวง หญิงสาวผมสีเทาใต้ร่มหันมามอง</div>
<div style="display: flex; gap: 8px"><span style="width: 30px; height: 30px; border-radius: 50%; background: #2B3F5A; border: 2px solid #F0B44C; flex: none" aria-hidden="true"></span><div><div style="font-size: 11px; color: #F0B44C; font-weight: 600">โนอา</div><div style="background: #1D2C45; border-radius: 4px 14px 14px 14px; padding: 8px 12px; font-size: 15px; line-height: 1.5">"เพลงนั้น… ฉันเคยได้ยินที่ไหนสักแห่ง"</div></div></div>
<div style="padding-left: 38px; font-size: 14px; line-height: 1.7; color: #C8D4E1; font-style: italic">คนเร่ร่อนหันมาฟัง</div>
<div style="display: flex; justify-content: center; gap: 6px; flex-wrap: wrap"><span style="font-size: 11px; border: 1px solid #2B3F5A; border-radius: 999px; padding: 3px 10px; color: #C8D4E1">Stamina −1</span><span style="font-size: 11px; border: 1px solid #2B3F5A; border-radius: 999px; padding: 3px 10px; color: #F0B44C">เหรียญ +1</span></div>
</main>
<footer style="background: #0F1A2B; border-top: 1px solid #2B3F5A; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 6px; overflow: hidden" role="group" aria-label="แถบ action">
<button type="button" aria-label="พูดคุย" style="background: #16243A; border: 1px solid #2B3F5A; border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><span class="ic per" aria-hidden="true"></span></button>
<button type="button" aria-label="สังเกต" style="background: #16243A; border: 1px solid #2B3F5A; border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><span class="ic obs" aria-hidden="true"></span></button>
<button type="button" aria-label="ลอบเร้น" style="background: #16243A; border: 1px solid #2B3F5A; border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><span class="ic sth" aria-hidden="true"></span></button>
<button type="button" aria-label="พักผ่อน" style="background: #16243A; border: 1px solid #2B3F5A; border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><span class="ic rest" aria-hidden="true"></span></button>
<button type="button" style="background: none; border: 1px solid #2B3F5A; color: #9FB0C3; border-radius: 10px; height: 44px; padding: 0 12px; font: inherit; font-size: 13px">อื่นๆ</button>
</div>
<div style="display: flex; gap: 8px">
<label for="actM" style="position: absolute; left: -9999px">พิมพ์สิ่งที่จะทำ</label>
<input id="actM" type="text" placeholder="พิมพ์สิ่งที่จะทำ…" style="flex: 1; min-width: 0; background: #16243A; color: #E8EEF5; border: 1px solid #3A4E68; border-radius: 22px; padding: 10px 14px; font: inherit; font-size: 16px; height: 44px; box-sizing: border-box">
<button type="button" style="background: #F0B44C; color: #0F1A2B; border: none; border-radius: 22px; padding: 0 18px; font: inherit; font-weight: 600; font-size: 15px; height: 44px">ส่ง</button>
</div>
<nav aria-label="แผงข้อมูล" style="display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #2B3F5A; padding-top: 6px">
<button type="button" aria-current="page" style="background: none; border: none; color: #F0B44C; font: inherit; font-size: 12px; min-height: 40px">ฉาก</button>
<button type="button" style="background: none; border: none; color: #9FB0C3; font: inherit; font-size: 12px; min-height: 40px">ตัวฉัน</button>
<button type="button" style="background: none; border: none; color: #9FB0C3; font: inherit; font-size: 12px; min-height: 40px">กระเป๋า</button>
<button type="button" style="background: none; border: none; color: #9FB0C3; font: inherit; font-size: 12px; min-height: 40px">คนรอบตัว</button>
</nav>
</footer>
</div>
</body>
</html>
